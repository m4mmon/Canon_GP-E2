# session.conf — paramètres de protocole (relu à chaque tour sauf vid/pid/init)

vid = 0x04A9
pid = 0x3272               # EOS 700D ; 0 = premier appareil Canon PTP trouvé

# Séquence d'initialisation : opcodes en hexa, paramètres après « : », séparés par « ; »
# 1002 OpenSession, 1001 GetDeviceInfo, 9114 SetRemoteMode (0x9 = branche GP-E2 « K323 »),
# 9115 SetEventMode, 91D5 état de connexion GPS (1 = connecté)
init = 1002:1 ; 1001 ; 9114:9 ; 9115:1 ; 91D5:1
# Séquence envoyée à l'arrêt (Ctrl+C)
fin = 91D5:0 ; 1003

test_rtc = 1               # 91D7 au démarrage (« IsHighPrecRTC »), réponse journalisée
pps = 0                    # 91D8:1 au démarrage — inutile (validé : la synchro passe par 91D8:3, ci-dessous)

# Mise à l'heure (« Appliquer » dans le menu GPS) — séquence validée sur le 700D le 19/10/2026 :
#   0xC1ED (demande) → 91DB [48][struct tm] → 0xC1EC(05) (heure écrite) → 91D8:3 (synchro terminée)
heure_envoi = c1ed         # jamais | demarrage | c1ed | les_deux
heure_format = tm          # seul format accepté ([u32 longueur][struct tm 11 × int32]) ; un autre a bloqué le 700D
heure_tm_base = utc        # utc | locale (fuseau du Pi)
heure_instant_ms = 900     # moment d'envoi de 91DB dans la seconde (le 700D ajoute 1 s) ; -1 = immédiat
heure_correction_s = 0     # correction ajoutée à l'heure envoyée (ex. -1, 0.5) si un écart persiste

# Réactions aux événements du boîtier : sur_XXXX = liste séparée par « ; »
#   HEURE = envoie l'heure (91DB) ; POS = envoie la position tout de suite ;
#   SEC = attend le début de la seconde suivante ; PAUSE:ms ; ou opcode[:params] en hexa
sur_c1ec = SEC ; 91D8:3    # fin de synchro → PROP_GPS_TIME_SYNC (2,0), ferme la boîte de dialogue

# Rythme
intervalle_defaut = 15     # s, tant que le boîtier n'a pas donné 0xD14D
periode_evenements = 1.0   # s entre deux GetEvent
# Événements (hexa) qui déclenchent un envoi immédiat de la position, ex. : C1EB C1EE
position_sur_evenement =

# Envois à chaque intervalle, en plus des infos GPS (91D9)
envoyer_satellites = 1     # 91DA
envoyer_batterie = 1       # 91DE
envoyer_boussole = 0       # 91DD (n'agit que si la boussole est activée sur le boîtier)
garder_allume = 0          # 911D KeepDeviceOn (empêche l'extinction auto)

# Format des infos GPS (91D9)
format_angle = dm          # dm : minutes décimales /10000 (style NMEA) | dms : secondes /1000
longueur_infos = 128       # taille de la structure envoyée (128 = taille de la propriété)

journal_proprietes = 0     # 1 = journaliser toutes les propriétés reçues par GetEvent

# Délais d'attente des réponses (ms) ; une opération sans réponse est abandonnée et l'outil continue,
# sauf après max_echecs échecs d'affilée.
delai_ms = 5000
delai_91db_ms = 15000
max_echecs = 3
