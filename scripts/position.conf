# position.conf — relu à chaque envoi (modifie-le pendant que l'outil tourne)

# --- Position (degrés décimaux ; négatif = Sud / Ouest) ---
latitude = 44.017534         # Place Nationale, Montauban (arcades du XVIIe s.)
longitude = 1.353963
altitude = 95              # mètres ; négatif = sous le niveau de la mer

# --- Champs EXIF (octets 0x5C-0x73 des infos GPS, disposition déduite de l'EXIF le 19/10/2026) ---
satellites = 12            # 0x5C, 2 caractères au plus (GPSSatellites)
statut = A                 # 0x5E, A = mesure valide, V = invalide (GPSStatus)
mode_mesure = 3            # 0x60, 2 = 2D, 3 = 3D (GPSMeasureMode ; n'agit PAS sur l'affichage 2D/3D)
dop = 3.1                  # 0x64, précision (GPSDOP, rationnel /100)
datum = WGS-84             # 0x6C, 7 caractères au plus (GPSMapDatum)
# Remplace les 24 octets 0x5C-0x73 en brut (hexadécimal, 48 caractères ; espaces permis).
# Laisser commenté pour utiliser les champs ci-dessus. Exemple équivalent aux valeurs ci-dessus :
#brut_5c = 31 30 41 00 33 00 00 00 90 01 00 00 64 00 00 00 57 47 53 2d 38 34 00 00

# --- État des satellites (opcode 0x91DA), établi par essais le 19/10/2026 ---
# sat_etat : bits 0-1 = type de position : 0 = aucune (« --- »), 1 = 2D sans altitude,
#            2 = 3D, 3 = 2D avec altitude ;
#            bit 2 (+4) = heure valide → menu « Appliquer » (mise à l'heure) disponible.
#            Bits au-delà ignorés ou valeur invalide (8 → comme 0). Vrai GP-E2 en 3D : probablement 6.
# sat_niveau : nombre de barres 0-3 (au-delà : 0 barre).
# sat_status : aucun effet visible (0 à 8 essayés).
sat_status = 1
sat_niveau = 2
sat_etat = 6

# --- Batterie du GPS (opcode 0x91DE ; défaut boîtier = 2) ---
batterie = 2

# --- Boussole (opcode 0x91DD, envoyé si envoyer_boussole = 1 dans session.conf) ---
boussole = 190             # degrés
boussole_ref = M           # M = nord magnétique, T = nord géographique
boussole_octet5 = 0        # octet inconnu envoyé avec la référence
